<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nông Trại</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#dff0ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#checking{position:fixed;inset:0;display:grid;place-items:center;text-align:center;color:#2f6f3e;background:linear-gradient(#bfe9ff,#eaf8d8)}
</style>
<script src="./config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
</head>
<body>
<div id="checking"><div><b>🌾 Nông Trại</b><br><small>Đang kiểm tra đăng nhập...</small></div></div>
<script>
(function(){
 if(typeof firebase==='undefined'||typeof FB_CONFIG==='undefined'||!FB_CONFIG){location.replace('./auth.html');return}
 try{
  if(!firebase.apps.length)firebase.initializeApp(FB_CONFIG);
  firebase.auth().onAuthStateChanged(function(user){
   if(!user){location.replace('./auth.html');return}
   location.replace('./game.html');
  },function(){location.replace('./auth.html')});
 }catch(e){location.replace('./auth.html')}
})();
</script>
</body>
</html>
