<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vườn Cây Vui Vẻ</title>
<script src="../config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link rel="stylesheet" href="style.css"></head><body>
<div class="hud">
<button class="btn island" id="island">🏝️ Về đảo</button>
<span class="pill" id="coins"></span>
<span class="pill"><span id="lvl"></span><span class="xp"><i id="xpb"></i></span></span>
<button class="btn" id="shop">🛒 Cửa hàng <span id="cur"></span></button>
<button class="btn" id="all">🧺 Thu hoạch</button>
<button class="btn" id="vw"></button><button class="btn" id="snd" title="Âm thanh">🔊</button><button class="btn" id="reset" title="Chơi lại">↺</button></div>
<div class="stage" id="stage"><div class="fly">🦋</div><div class="fly">🐝</div><div class="fly">🦋</div></div>
<div class="msg" id="msg">Mở cửa hàng để chọn hạt giống, rồi chạm vào ô đất để gieo!</div>
<div class="modal" id="modal"><div class="sheet"><h2><span>🛒 Cửa hàng hạt giống</span><button class="btn" id="x">✕</button></h2><div class="grid" id="grid"></div></div></div>
<script src="script.js"></script></body></html>
