<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vườn Trồng · Nông Trại</title>
<script src="./config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff}body{overflow:hidden;background:#5aa34b}
.garden{position:relative;width:100%;height:100dvh;background:url('./img/1792260919166.png') center/100% 100% no-repeat;overflow:hidden}
.garden:after{content:"";position:absolute;z-index:1;inset:0;background:linear-gradient(#0002,transparent 25%,#0001);pointer-events:none}
.top{position:absolute;z-index:10;left:10px;right:10px;top:10px;display:flex;align-items:center;gap:8px}.back,.pill{border:3px solid #57371f;border-radius:14px;background:#fff2bd;color:#3b2919;padding:8px 12px;font-weight:1000;box-shadow:0 4px 12px #0004}.back{cursor:pointer}.sp{flex:1}.gem{background:#dff7ff}
.title{position:absolute;z-index:5;top:66px;left:50%;transform:translateX(-50%);background:#5a351ddd;border:3px solid #e4bd73;border-radius:14px;padding:7px 18px;font-weight:1000;text-shadow:0 2px #0005}
.plots{position:absolute;z-index:20;pointer-events:auto;touch-action:manipulation;left:50%;top:54%;transform:translate(-50%,-50%);width:min(84vw,650px);display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.plot{aspect-ratio:1.25/1;pointer-events:auto;touch-action:manipulation;-webkit-tap-highlight-color:transparent;border:3px solid #ff3030;border-radius:15px;background:rgba(255,40,40,.38);box-shadow:inset 0 0 0 3px #ffb000aa,0 5px 10px #0004;color:#fff;display:grid;place-items:center;align-content:center;cursor:pointer;text-shadow:0 2px #0006;font-size:16px;font-weight:1000}.plot:before{content:'Ô đất';position:absolute}.plot{position:relative}.plot span,.plot small{position:relative;z-index:2}.plot small{background:#ff3030dd;border-radius:8px;padding:2px 6px}.plot span{font-size:42px}.plot small{font-weight:1000;margin-top:3px}.plot.ready{animation:pulse .8s infinite alternate}@keyframes pulse{to{filter:brightness(1.25);transform:translateY(-2px)}}
.bottom{position:absolute;z-index:10;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:8px;padding:7px;border:3px solid #51351e;border-radius:18px;background:#2b211bdc}.bottom button{border:2px solid #6b4725;border-radius:12px;background:#fff0bd;color:#3b2919;padding:8px 12px;font-weight:1000;cursor:pointer}
.modal{position:fixed;inset:0;z-index:30;background:#0008;display:none;place-items:center;padding:15px}.modal.on{display:grid}.card{width:min(92vw,420px);background:#fff8dc;color:#3b2919;border:4px solid #79512d;border-radius:20px;padding:14px}.seeds{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.seed{border:2px solid #b4935c;border-radius:14px;background:#fffdf2;color:#3b2919;padding:10px;cursor:pointer;display:grid;gap:3px;text-align:center;font-weight:1000;box-shadow:0 2px 6px #0002}.seed:hover{filter:brightness(1.05)}.seed small{font-size:11px;color:#66553f}.close{width:100%;margin-top:10px;border:0;border-radius:11px;padding:9px;background:#6aae45;color:#fff;font-weight:1000}
@media(max-width:600px){.plots{width:88vw;grid-template-columns:repeat(2,1fr);gap:10px;top:52%}.plot{max-height:110px}.plot span{font-size:36px}.title{top:60px;font-size:13px}.pill,.back{font-size:12px;padding:7px 9px}}
</style></head><body><main class="garden">
<header class="top"><button class="back" id="back">🏝️ Đảo</button><div class="sp"></div><div class="pill">🪙 <span id="coins">0</span></div><div class="pill gem">💎 <span id="gems">0</span></div></header>
<div class="title">🌾 VƯỜN TRỒNG</div><div class="plots" id="plots"></div>
<nav class="bottom"><button id="seedBtn">🌱 Hạt giống</button><button id="warehouseBtn">📦 Kho</button></nav>
</main><div class="modal" id="modal"><div class="card"><h2>🌱 Chọn hạt giống</h2><div class="seeds" id="seeds"></div><button class="close" id="close">Đóng</button></div></div>
<script>
(()=>{'use strict';const KEY='nongtrai_new_v1',C={carrot:{id:'carrot',n:'Cà rốt',i:'🥕',c:5,s:12,t:3000,x:3},corn:{id:'corn',n:'Ngô',i:'🌽',c:8,s:19,t:5000,x:5},tomato:{id:'tomato',n:'Cà chua',i:'🍅',c:12,s:28,t:7000,x:8},wheat:{id:'wheat',n:'Lúa mì',i:'🌾',c:15,s:35,t:9000,x:10}};
const D={version:1,coins:100,gems:0,xp:0,level:1,selectedCrop:'carrot',inventory:{carrot:0,corn:0,tomato:0,wheat:0},plots:Array.from({length:8},()=>({state:'empty',crop:null,plantedAt:0,readyAt:0})),stats:{planted:0,harvested:0,earned:0}};const merge=(a,b)=>{if(!b||typeof b!=='object')return a;Object.keys(b).forEach(k=>{if(a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k])&&b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k]))merge(a[k],b[k]);else a[k]=b[k]});return a};let S=JSON.parse(JSON.stringify(D));try{const x=localStorage.getItem(KEY);if(x)merge(S,JSON.parse(x))}catch(e){}let user=null;
async function save(){localStorage.setItem(KEY,JSON.stringify(S));if(user)try{await firebase.firestore().collection('users').doc(user.uid).set({game:S,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true})}catch(e){}}
function draw(){coins.textContent=Math.floor(S.coins||0);gems.textContent=Math.floor(S.gems||0);plots.innerHTML='';S.plots.forEach((p,i)=>{if(p.state==='grow'&&Date.now()>=p.readyAt)p.state='ready';const b=document.createElement('button');b.type='button';b.className='plot '+(p.state==='grow'?'grow ':'')+(p.state==='ready'?'ready':'');if(p.state==='empty')b.innerHTML='<span>🟫</span><small>Ô '+(i+1)+'</small>'; else if(p.state==='grow'){const c=C[p.crop];b.innerHTML='<span>'+c.i+'</span><small>'+formatTime(Math.max(0,p.readyAt-Date.now()))+'</small>'}else{const c=C[p.crop];b.innerHTML='<span>'+c.i+'</span><small>Thu hoạch</small>'}b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();act(i)});b.addEventListener('touchend',e=>{e.preventDefault();act(i)},{passive:false});plots.appendChild(b)})}\nfunction formatTime(ms){if(ms<=0)return 'Chín!';return Math.ceil(ms/1000)+'s'}\nfunction addXP(n){S.xp=(Number(S.xp)||0)+n;while(S.xp>=(50+(Number(S.level)||1)-1)*35+50){const need=50+(Number(S.level)||1-1)*35;S.xp-=need;S.level=(Number(S.level)||1)+1}}
function act(i){const p=S.plots[i];if(p.state==='grow'){if(Date.now()>=p.readyAt){p.state='ready';save();draw()}else{const c=C[p.crop];alert('Cây '+c.n+' đang lớn. Còn '+formatTime(p.readyAt-Date.now())+'.')}return}if(p.state==='ready'){const c=C[p.crop];S.coins+=c.s;S.inventory[c.id]=(S.inventory[c.id]||0)+1;S.stats.harvested=(S.stats.harvested||0)+1;S.stats.earned=(S.stats.earned||0)+c.s;addXP(c.x);S.plots[i]={state:'empty',crop:null,plantedAt:0,readyAt:0};save();draw();return}const c=C[S.selectedCrop];if(S.coins<c.c){alert('Không đủ xu');return}S.coins-=c.c;S.plots[i]={state:'grow',crop:c.id,plantedAt:Date.now(),readyAt:Date.now()+c.t};S.stats.planted=(S.stats.planted||0)+1;addXP(1);save();draw()}
document.getElementById('seedBtn').onclick=()=>{seeds.innerHTML='';Object.entries(C).forEach(([k,c])=>{const b=document.createElement('button');b.className='seed';b.innerHTML='<span style="font-size:36px">'+c.i+'</span><b>'+c.n+'</b><small>🪙 '+c.c+' · Bán 🪙'+c.s+'</small>';b.onclick=()=>{S.selectedCrop=k;modal.classList.remove('on');save()};seeds.appendChild(b)});modal.classList.add('on')};document.getElementById('close').onclick=()=>modal.classList.remove('on');document.getElementById('back').onclick=()=>location.href='./game.html';document.getElementById('warehouseBtn').onclick=()=>location.href='./kho.html';setInterval(draw,1000);
if(typeof firebase!=='undefined'&&typeof FB_CONFIG!=='undefined'){if(!firebase.apps.length)firebase.initializeApp(FB_CONFIG);firebase.auth().onAuthStateChanged(async u=>{if(!u){location.replace('./login.html');return}user=u;try{const d=await firebase.firestore().collection('users').doc(u.uid).get();if(d.exists&&d.data().game)S=merge(JSON.parse(JSON.stringify(D)),d.data().game)}catch(e){}draw()})}else draw();
})();
</script></body></html>
