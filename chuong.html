<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chuồng Nuôi Thú · Nông Trại</title>
<script src="./config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#7fbf58;color:#3b2919}
body{min-height:100dvh;overflow-x:hidden}
#barn-page{min-height:100dvh;position:relative;padding:0;z-index:2}
 .barn-bg{position:fixed;inset:0;background:url('./img/chuong-trai.webp') center center/cover no-repeat;z-index:0}.barn-bg:after{display:none}
 .barn-shade{position:fixed;inset:0;background:transparent;z-index:1;pointer-events:none}
.topbar{position:fixed;top:10px;left:10px;right:10px;z-index:20;max-width:none;margin:0 auto 10px;display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.topbar button{border:3px solid #57371f;border-radius:14px;background:#fff0bd;color:#3b2919;padding:9px 13px;font-weight:1000;cursor:pointer;box-shadow:0 5px 14px #0005}
.title{flex:1;min-width:190px;text-align:center;color:#fff8d5;text-shadow:0 3px 5px #000;font-weight:1000;font-size:clamp(20px,5vw,34px)}
.money{background:#fff9df;border:3px solid #57371f;border-radius:14px;padding:9px 13px;font-weight:1000;box-shadow:0 5px 14px #0005}
 .barn-card{width:100%;height:100dvh;margin:0;background:transparent;border:0;border-radius:0;padding:0;box-shadow:none}
.new-ranch{display:block;width:100%;height:100dvh;padding:0;background:transparent!important}
.new-ranch-top{display:none!important}
.new-ranch-top span:first-of-type{margin-left:auto}
.new-ranch-top i{font-style:normal}
.new-pet-scene{position:fixed;inset:0;width:100%;height:100dvh;min-height:0;border-radius:0;overflow:auto;background:transparent!important;border:0!important;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:110px 18px 24px;align-content:end;z-index:3}
.new-pet{width:82px;min-height:0;padding:0;text-align:center;background:transparent!important;border:0!important;border-radius:0!important;box-shadow:none!important;color:#3b2919;will-change:left,top;pointer-events:auto}
.new-pet img{width:76px;height:76px;object-fit:contain;display:block;margin:auto;filter:drop-shadow(0 3px 2px #0004);transform-origin:50% 90%}


.new-ranch-actions{display:none!important}
.barn-bottom{position:fixed;z-index:30;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:8px;padding:8px;border:3px solid #5b3a1e;border-radius:22px;background:#2b211be8;box-shadow:0 7px 22px #0006}
.barn-nav{min-width:92px;border:2px solid #694724;border-radius:14px;padding:9px 13px;background:#fff0bd;color:#3a2412;font-weight:1000;cursor:pointer}
.barn-nav.shop{background:linear-gradient(#ffd85c,#e99b28);font-size:15px}
.new-ranch-actions button{border:2px solid #79552d;border-radius:12px;padding:12px;background:linear-gradient(#fff4bd,#e5b74e);color:#3b2919;font-weight:1000;cursor:pointer}
.new-ranch-help{display:none!important}
.pet-shop-popup{display:none!important}
.pet-shop-card{display:none!important}
.pet-shop-head{display:flex;align-items:center;justify-content:space-between;font-size:18px;margin-bottom:8px}.pet-shop-head button{border:0;border-radius:9px;background:#e6c77c;padding:7px 10px;font-weight:900;cursor:pointer}
.pet-shop-money{padding:8px;border-radius:10px;background:#fff0bd;text-align:center;font-weight:1000;margin-bottom:9px}
.pet-shop-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.pet-shop-item{border:2px solid #b4935c;border-radius:14px;background:#fffdf2;color:#3b2919;padding:10px;cursor:pointer;display:grid;gap:3px;text-align:center}
.pet-shop-item img{width:82px;height:82px;object-fit:contain;margin:auto}.pet-shop-item b{font-size:15px}.pet-shop-item span{font-weight:1000}.pet-shop-item small{font-size:11px;color:#66553f}
@media(max-width:700px){
 #barn-page{padding:0}.topbar{margin-bottom:7px}.topbar button{padding:7px 9px;font-size:12px}.title{font-size:20px}.money{padding:7px 9px;font-size:12px}
 .barn-card{padding:0;border:0;border-radius:0}.new-ranch{padding:70px 6px 6px}.new-pet-scene{height:calc(100dvh - 150px);min-height:0;max-height:none;padding:8px;gap:6px}
 .new-pet{min-height:95px;padding:5px}.new-pet img{width:52px;height:52px}.new-pet small{font-size:9px}.new-pet-actions{margin-top:3px}.new-pet-actions button{padding:3px 6px;font-size:10px}
 .new-ranch-top{font-size:11px;padding:8px}.new-ranch-actions button{padding:9px 5px;font-size:12px}.new-ranch-help{font-size:9px}
}
@keyframes petWalk{
  0%{transform:scaleX(var(--pet-dir,1)) translateY(0) rotate(-2deg)}
  50%{transform:scaleX(var(--pet-dir,1)) translateY(-4px) rotate(2deg)}
  100%{transform:scaleX(var(--pet-dir,1)) translateY(0) rotate(-2deg)}
}
.pet-status{position:absolute;left:50%;top:-20px;bottom:auto;transform:translateX(-50%);white-space:nowrap;background:#fffbe8e8;border:1px solid #8a6b3e;border-radius:10px;padding:2px 7px;font-size:12px;font-weight:900;box-shadow:0 2px 6px #0002;pointer-events:none}
</style>
</head>
<body><script>location.replace('./nuoipet/index.html');</script></body>
</html>
