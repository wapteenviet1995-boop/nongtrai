<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nông Trại</title>
<script src="./config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#3b2f1e;background:#bfe9ff}
body{overflow:hidden}.top{height:64px;display:flex;align-items:center;gap:10px;padding:8px 12px;background:#fffdf6;border-bottom:3px solid #d9c99f;position:relative;z-index:5}.logo{font-weight:1000;color:#2f8f4e;font-size:20px}.sp{flex:1}.coin{font-weight:900;background:#fff3b0;border:2px solid #dfbd50;border-radius:12px;padding:7px 10px}.btn{border:2px solid #bda981;background:#fff;border-radius:12px;padding:8px 12px;font-weight:900;cursor:pointer}.danger{background:#fff0ed;border-color:#e5aaa0;color:#a33}
#game{height:calc(100dvh - 64px);display:grid;place-items:center;padding:14px}.farm{position:relative;width:min(100%,1000px);height:min(100%,680px);overflow:hidden;border:5px solid #76502d;border-radius:24px;background:linear-gradient(#8bd5ff 0 32%,#83c95a 32% 100%);box-shadow:0 14px 40px #0003}
.cloud{position:absolute;font-size:55px;opacity:.8}.c1{left:8%;top:7%}.c2{right:10%;top:14%}.hill{position:absolute;left:-10%;right:-10%;bottom:18%;height:42%;border-radius:50% 50% 0 0;background:#6fbd55}
.house{position:absolute;left:8%;bottom:27%;width:210px;height:150px;background:#d9a25e;border:5px solid #73471f;border-radius:12px}.roof{position:absolute;left:-20px;top:-78px;width:240px;height:100px;background:#b9503f;border:5px solid #73471f;clip-path:polygon(50% 0,100% 100%,0 100%)}.door{position:absolute;bottom:0;left:78px;width:55px;height:85px;background:#73471f;border:4px solid #4e321c;border-radius:10px 10px 0 0}
.field{position:absolute;right:7%;bottom:15%;width:48%;height:42%;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.plot{background:#a96d3d;border:4px solid #704522;border-radius:12px;display:grid;place-items:center;font-size:30px;cursor:pointer;box-shadow:inset 0 8px 0 #bd824c}.plot.grow{background:#7baf43}.plot.ready{background:#e5b04c}.title{position:absolute;left:50%;top:8%;transform:translateX(-50%);background:#fffdf6eF;border:3px solid #8d6a39;border-radius:16px;padding:9px 18px;font-size:24px;font-weight:1000;white-space:nowrap}.hint{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);background:#fffdf6eF;border-radius:14px;padding:8px 14px;font-weight:800;white-space:nowrap}
.modal-bg{position:fixed;inset:0;background:#0007;display:none;place-items:center;z-index:20}.modal-bg.on{display:grid}.modal{width:min(92vw,430px);background:#fffdf6;border:3px solid #d4c39c;border-radius:20px;padding:20px;box-shadow:0 20px 60px #0005}.modal h2{margin-top:0}.modal p{line-height:1.5}
@media(max-width:650px){.top{height:58px}.logo{font-size:17px}.coin{font-size:13px;padding:6px}.farm{border-radius:16px}.house{transform:scale(.72);transform-origin:left bottom}.field{right:4%;width:58%;height:38%;gap:5px}.plot{font-size:24px}.title{font-size:18px;top:5%}.hint{font-size:11px;bottom:2%}}
</style>
</head>
<body>
<header class="top">
  <div class="logo">🌾 NÔNG TRẠI</div><div class="sp"></div>
  <div class="coin">🪙 <span id="coins">100</span></div>
  <button class="btn danger" id="logout">Đăng xuất</button>
</header>
<main id="game">
  <section class="farm">
    <div class="cloud c1">☁️</div><div class="cloud c2">☁️</div><div class="hill"></div>
    <div class="title">🏡 Nông Trại Của Bạn</div>
    <div class="house"><div class="roof"></div><div class="door"></div></div>
    <div class="field" id="field"></div>
    <div class="hint">🌱 Chạm vào ô đất để trồng và thu hoạch</div>
  </section>
</main>
<div class="modal-bg" id="modal"><div class="modal"><h2 id="mt"></h2><p id="mb"></p><button class="btn" id="mc">Đóng</button></div></div>
<script src="./game.js"></script>
</body>
</html>
