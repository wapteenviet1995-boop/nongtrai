<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nông Trại</title>
<script src="./config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#071b2d;color:#fff}
body{overflow:hidden}
#game{position:relative;width:100%;height:100dvh;overflow:hidden;background:#65c9f4}
.map-viewport{
  position:absolute;inset:0;overflow:hidden;touch-action:auto;
}
.map-wrap{
  position:absolute;left:0;top:0;width:100vw;
  height:100dvh;
  transform-origin:0 0;
}
.map{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:fill;
  user-select:none;-webkit-user-drag:none;pointer-events:none;
}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,#001d3a22 0%,transparent 35%,#001d3a10 100%);pointer-events:none}
.top{
  position:absolute;left:12px;right:12px;top:10px;z-index:10;
  display:flex;align-items:center;gap:8px;pointer-events:none;
}
.player{
  display:flex;align-items:center;gap:9px;min-width:230px;
  padding:7px 12px 7px 7px;border:3px solid #57371f;border-radius:18px;
  background:linear-gradient(#fff7d8,#e8c879);color:#3b2514;
  box-shadow:0 5px 16px #0005;pointer-events:auto;
}
.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#9bd8ff;border:3px solid #6b4826;font-size:29px}
.player b{display:block;font-size:16px}.player small{display:block;font-weight:800}
.xp{height:7px;margin-top:4px;background:#5b472d;border-radius:10px;overflow:hidden;width:120px}
.xp i{display:block;width:38%;height:100%;background:#67c93f}
.sp{flex:1}
.currency{display:flex;gap:7px;align-items:center;pointer-events:auto}
.pill{min-width:94px;text-align:center;padding:9px 12px;border:3px solid #57371f;border-radius:16px;background:#fff4bb;color:#352311;font-weight:1000;box-shadow:0 5px 14px #0004}
.pill.gem{background:#d8f5ff}
.icon-btn{width:45px;height:45px;border:3px solid #57371f;border-radius:14px;background:#fff4bb;font-size:22px;cursor:pointer;box-shadow:0 4px 12px #0004}
.hotspot{
  position:absolute;z-index:5;transform:translate(-50%,-50%);
  border:3px solid #5a3517;border-radius:16px;padding:8px 13px;
  background:linear-gradient(#fff3a4,#d99b35);color:#3a220e;
  font-weight:1000;font-size:15px;white-space:nowrap;
  box-shadow:0 5px 13px #0006;cursor:pointer;
  transition:transform .15s,filter .15s;
}
.hotspot:hover{transform:translate(-50%,-50%) scale(1.07);filter:brightness(1.08)}
.hotspot:active{transform:translate(-50%,-50%) scale(.96)}
.map-wrap .hotspot{z-index:6}
.hs-dragon{left:51%;top:19%}.hs-ach{left:79%;top:22.5%}.hs-house{left:58%;top:43%}
.hs-production{left:78%;top:52.5%}.hs-barn{left:24%;top:50%}.hs-field{left:49%;top:73%}
.hs-mine{left:19%;top:88%}.hs-warehouse{left:82%;top:75%}
/* Chuồng/Kho/Đào Mỏ đã có chữ sẵn trong ảnh nền: chỉ giữ vùng bấm trong suốt */
.hs-dragon,.hs-ach,.hs-house,.hs-production,.hs-barn,.hs-field,.hs-mine,.hs-warehouse{
  background:transparent!important;
  border:0!important;
  box-shadow:none!important;
  color:transparent!important;
  font-size:0!important;
  padding:18px 28px;
  min-width:72px;
  min-height:48px;
  text-shadow:none;
}
.notice{
  position:absolute;z-index:7;left:12px;top:92px;width:230px;
  padding:12px;border:3px solid #59371f;border-radius:17px;
  background:#2e2118e8;box-shadow:0 7px 20px #0005
}
.notice h3{margin:0 0 7px;color:#ffe083}.notice div{font-size:13px;font-weight:750;line-height:1.55}
.bottom{
  position:absolute;z-index:10;left:50%;bottom:10px;transform:translateX(-50%);
  display:flex;gap:8px;align-items:center;padding:8px;
  border:3px solid #5b3a1e;border-radius:23px;background:#2b211be8;
  box-shadow:0 7px 22px #0006;max-width:96vw;overflow:auto
}
.nav{
  min-width:76px;border:2px solid #694724;border-radius:14px;padding:7px 9px;
  background:#fff0bd;color:#3a2412;font-weight:1000;cursor:pointer
}
.nav.main{min-width:190px;background:linear-gradient(#6ee05e,#2d9d45);color:#fff;border-color:#285f2d;font-size:16px}
.modal-bg{position:fixed;inset:0;background:#0008;display:none;place-items:center;z-index:50}
.modal-bg.on{display:grid}.modal{width:min(92vw,430px);background:#fff9df;color:#3b2919;border:4px solid #8c6330;border-radius:22px;padding:20px;box-shadow:0 20px 70px #0007}.modal h2{margin:0 0 10px}.modal p{line-height:1.5}.close{border:0;border-radius:12px;padding:9px 16px;background:#4ca54b;color:#fff;font-weight:900;cursor:pointer}
.logout{background:#ffe1d9;color:#8f2d20}
@media(max-width:700px){
  .player{min-width:170px;padding:5px 8px}.avatar{width:40px;height:40px;font-size:24px}
  .player b{font-size:13px}.player small{font-size:10px}.xp{width:90px}
  .pill{min-width:72px;padding:7px 8px;font-size:12px}.icon-btn{width:39px;height:39px;font-size:18px}
  .notice{display:none}.hotspot{font-size:11px;padding:6px 8px;border-width:2px}
  .bottom{bottom:6px;padding:5px}.nav{min-width:64px;font-size:10px;padding:6px}.nav.main{min-width:120px;font-size:12px}
}

.pet-shop{font-size:14px}.pet-summary{padding:9px 11px;margin-bottom:8px;border-radius:12px;background:#fff0bd;border:2px solid #9b8154}.pet-list{display:grid;gap:8px;max-height:42vh;overflow:auto}.pet-card{display:grid;grid-template-columns:45px 1fr;gap:8px;padding:9px;border:2px solid #b4935c;border-radius:14px;background:#fffdf2}.pet-icon{font-size:34px;display:grid;place-items:center}.pet-info small,.pet-info strong{display:block;margin-top:3px}.pet-info strong{font-size:12px;color:#39713c}.pet-actions{grid-column:1/-1;display:flex;gap:6px}.pet-btn,.pet-buy-btn{border:2px solid #79552d;border-radius:10px;padding:7px 9px;background:#fff0bd;color:#3b2919;font-weight:900;cursor:pointer}.pet-btn:disabled{opacity:.45;cursor:not-allowed}.pet-heading{margin:12px 0 7px}.pet-buy{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.pet-buy-btn{display:grid;gap:2px;text-align:center}.pet-buy-btn small{font-weight:900}.pet-note,.pet-empty{font-size:12px;color:#66553f;margin:9px 0 0}

/* Nuôi Thú cũ - chuồng động */
.old-ranch{display:flex;flex-direction:column;gap:8px;height:100%;min-height:520px}
.old-ranch-top{display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(255,255,255,.08);border-radius:12px}
.old-ranch-top span{margin-left:auto}
.old-ranch-top button{border:0;border-radius:9px;padding:7px 9px;background:#8b5e3c;color:#fff;font-weight:800}
.old-ranch-top button.on{background:#c0392b}
.pet-scene{position:relative;width:100%;aspect-ratio:16/9;min-height:220px;max-height:360px;overflow:hidden;border-radius:16px;background:url('./img/chuong-trai.webp') center center/100% 100% no-repeat;border:2px solid rgba(0,0,0,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.pet-scene:before{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(255,255,255,.04),rgba(255,205,90,.03));pointer-events:none}
.old-pet{position:absolute;min-width:58px;text-align:center;cursor:pointer;transition:left .9s ease,top .9s ease,transform .35s ease;user-select:none}
.old-pet-body{font-size:46px;line-height:48px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.18))}
.old-pet.baby .old-pet-body{font-size:36px}
.old-pet-label{display:inline-block;max-width:120px;padding:3px 6px;border-radius:8px;background:rgba(0,0,0,.58);color:#fff;font-size:11px;font-weight:800;white-space:nowrap}
.old-food-grid,.old-buy-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.old-food-grid button,.old-buy-grid button,.old-upgrade{border:0;border-radius:10px;padding:8px;background:var(--pn,#fff);color:var(--tx,#222);font-weight:800;border:1px solid var(--bd,#ddd)}
.old-food-grid button.on{outline:3px solid #6fcf59;background:rgba(111,207,89,.18)}
.old-food-grid small,.old-buy-grid small{display:block;font-size:10px;opacity:.7;margin-top:2px}
.old-section-title{font-weight:900;font-size:13px;margin:4px 0}
.old-upgrade{width:100%;margin-top:4px;background:#78b94e;color:#fff}
</style>
</head>
<body>
<main id="game">
  <div class="map-viewport" id="mapViewport">
  <div class="map-wrap" id="mapWorld">
    <img class="map" src="./img/file_000000007b508209afe9fddd71d47262.png" alt="Bản đồ Nông Trại">
    <div class="shade"></div>
  <button class="hotspot hs-dragon" data-feature="dragon">🐉 Đảo Rồng</button>
  <button class="hotspot hs-ach" data-feature="achieve">🏆 Thành tựu & BXH</button>
  <button class="hotspot hs-house" data-feature="house">🏡 Nhà</button>
  <button class="hotspot hs-production" data-feature="production">⚙️ Sản xuất</button>
  <button class="hotspot hs-barn" data-feature="barn">🐄 Chuồng</button>
  <button class="hotspot hs-field" data-feature="field">🌾 Ruộng</button>
  <button class="hotspot hs-mine" data-feature="mine">⛏️ Đào Mỏ</button>
  <button class="hotspot hs-warehouse" data-feature="warehouse">📦 Kho</button>
  </div>
</div>

  <header class="top">
    <div class="player">
      <div class="avatar">👨‍🌾</div>
      <div><b>Nông Dân Anh</b><small>⭐ Lv.12 · 450/1200 XP</small><div class="xp"><i></i></div></div>
    </div>
    <div class="sp"></div>
    <div class="currency">
      <div class="pill">🪙 <span id="coins">100</span></div>
      <div class="pill gem">💎 <span id="gems">0</span></div>
      <button class="icon-btn" id="logout" title="Đăng xuất">🚪</button>
    </div>
  </header>

  <aside class="notice">
    <h3>🔔 THÔNG BÁO</h3>
    <div>🎉 Sự kiện mới đã bắt đầu!<br>🐉 Rồng mới đã xuất hiện!<br>🏆 BXH tuần đã cập nhật!<br>🎁 Đăng nhập hôm nay nhận quà!</div>
  </aside>


  <nav class="bottom">
    <button class="nav" data-feature="map">🗺️<br>Bản đồ</button>
    <button class="nav" data-feature="seeds">🌱<br>Hạt giống</button>
    <button class="nav" data-feature="warehouse">📦<br>Kho</button>
    <button class="nav main" data-feature="field">🌾 Vào Nông Trại<br><small>Trồng trọt · Thu hoạch</small></button>
    <button class="nav" data-feature="dragon">🐉<br>Đảo Rồng</button>
    <button class="nav" data-feature="achieve">🏆<br>Thành tựu</button>
    <button class="nav" data-feature="mine">⛏️<br>Đào Mỏ</button>
  </nav>
</main>

<div class="modal-bg" id="modal">
  <div class="modal">
    <h2 id="mt"></h2>
    <p id="mb"></p>
    <button class="close" id="mc">Đóng</button>
  </div>
</div>

<script src="./game.js"></script>\n<script src="./nuoipet/pets.js"></script>


<script>
(function(){
  const data={
    dragon:['🐉 Đảo Rồng','Khu vực nuôi rồng, nâng cấp rồng và nhận phần thưởng.'],
    achieve:['🏆 Thành tựu & BXH','Theo dõi thành tựu, thứ hạng và bảng xếp hạng người chơi.'],
    house:['🏡 Nhà','Khu nhà chính của nông dân và các nâng cấp trang trại.'],
    production:['⚙️ Sản xuất','Chế biến nông sản thành các sản phẩm có giá trị cao hơn.'],
    barn:['🐄 Chuồng','Nuôi vật nuôi và thu hoạch sản phẩm từ chuồng.'],
    field:['🌾 Ruộng','Trồng cây, chờ cây lớn rồi thu hoạch để kiếm xu.'],
    mine:['⛏️ Đào Mỏ','Mini game đào mỏ với quặng, năng lượng và nhiều tầng.'],
    warehouse:['📦 Kho','Quản lý nông sản, vật phẩm và sức chứa kho.'],
    map:['🗺️ Bản đồ','Đây là bản đồ chính của Nông Trại.'],
    seeds:['🌱 Hạt giống','Chọn giống cây để bắt đầu trồng trọt.']
  };
  function openFeature(key){
    if(key==='barn' && window.nongPet){ window.nongPet.open(); return; }
    const d=data[key]||['Nông Trại','Khu vực đang được xây dựng.'];
    document.getElementById('mt').textContent=d[0];
    document.getElementById('mb').innerHTML=d[1]+'<br><br><b>🚧 Phần chức năng sẽ được nối vào game ở bước tiếp theo.</b>';
    document.getElementById('modal').classList.add('on');
  }
  document.querySelectorAll('[data-feature]').forEach(b=>b.addEventListener('click',()=>openFeature(b.dataset.feature)));
  document.getElementById('mc').onclick=()=>document.getElementById('modal').classList.remove('on');
  document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('on')};
})();
</script>
</body>
</html>
