<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Đăng nhập - Nông Trại</title>
<link rel="stylesheet" href="./auth.css">
</head>
<body>
<main class="auth-card">
  <h1>🌾 Nông Trại</h1>
  <p class="sub">Đăng nhập hoặc tạo tài khoản để vào game</p>
  <div class="auth-actions"><button type="button" id="quickLogin">🔐 ĐĂNG NHẬP</button><button type="button" id="quickRegister">📝 ĐĂNG KÝ</button></div><div class="tabs">
    <button id="loginTab" class="on" type="button">Đăng nhập</button>
    <button id="registerTab" type="button">Đăng ký</button>
  </div>
  <form id="authForm">
    <label>Email<input id="username" type="email" autocomplete="email" maxlength="120" required></label>
    <label>Mật khẩu<input id="password" type="password" autocomplete="current-password" minlength="6" maxlength="64" required></label>
    <label id="confirmRow" hidden>Nhập lại mật khẩu<input id="confirm" type="password" autocomplete="new-password" minlength="6" maxlength="64"></label>
    <button class="submit" id="submitBtn" type="submit">Đăng nhập</button>
    <p id="msg" class="msg" aria-live="polite"></p>
  </form>
  <p class="note">Tài khoản được bảo vệ bằng Firebase Authentication và đồng bộ dữ liệu game trên đám mây.</p>
</main>
<script src="./config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="./auth.js"></script><script>(function(){const l=document.getElementById("quickLogin"),r=document.getElementById("quickRegister"),lt=document.getElementById("loginTab"),rt=document.getElementById("registerTab");if(l)l.onclick=()=>lt.click();if(r)r.onclick=()=>rt.click()})();</script>
</body>
</html>
