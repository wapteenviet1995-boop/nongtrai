<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Đảo Rồng</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="island">
  <header class="topbar">
    <button id="back">🏝️ Về đảo</button>
    <div class="title"><b>🐉 ĐẢO RỒNG</b><small>Ấp trứng · Nuôi rồng · Nhận sức mạnh</small></div>
    <div class="money">🪙 <span id="coins">0</span>　💎 <span id="gems">0</span></div>
  </header>
  <section class="dragon-field" id="dragonField"></section>
  <nav class="dock">
    <button data-tab="dragons">🐉<span>Rồng</span></button>
    <button data-tab="eggs">🥚<span>Ấp trứng</span></button>
    <button data-tab="explore">🗺️<span>Thám hiểm</span></button>
    <button data-tab="book">📖<span>Bộ sưu tập</span></button>
  </nav>
  <div class="panel" id="panel"><div class="card"><button class="x" id="close">✕</button><div id="panelBody"></div></div></div>
  <div class="toast" id="toast"></div>
</main>
<script src="./script.js"></script>
</body>
</html>
