<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kho · Nông Trại</title>
<script src="./config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#49301b}
body{min-height:100dvh;background:linear-gradient(180deg,#8ed9ef 0 17%,#82c85d 17% 100%);overflow-x:hidden}
body:before{content:"";position:fixed;left:-10%;right:-10%;bottom:-70px;height:55%;background:radial-gradient(ellipse at center,#6aae45 0 45%,#57963b 72%);z-index:-1}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:10px 12px;background:linear-gradient(#684424,#432b19);border-bottom:3px solid #2d1b0e;box-shadow:0 4px 14px #0004;color:#fff}
.back{border:2px solid #4e3219;border-radius:13px;background:linear-gradient(#fff2b4,#e6b958);padding:9px 12px;font-weight:1000;color:#49301b;box-shadow:inset 0 1px #fff8,0 2px 5px #0004;cursor:pointer}
.title{flex:1;text-align:center;font-size:22px;font-weight:1000;text-shadow:0 2px #0005}.money{background:#fff1b4;color:#4a301a;border:2px solid #4e3219;border-radius:14px;padding:8px 12px;font-weight:1000;white-space:nowrap}
.shell{width:min(94vw,780px);margin:22px auto 90px}
.sign{width:max-content;max-width:90%;margin:0 auto -10px;position:relative;z-index:2;padding:8px 28px;border:3px solid #5d3a1d;border-radius:10px;background:linear-gradient(#d99b4a,#a9652f);color:#fff6cf;font-size:20px;font-weight:1000;text-shadow:0 2px #6a3519;box-shadow:0 4px 8px #0004}
.panel{background:linear-gradient(#f7e1a8,#e4bd73);border:5px solid #6a4525;border-radius:22px;padding:20px 14px 16px;box-shadow:inset 0 0 0 3px #fff2bd,0 12px 30px #0004}
.info{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.info b{font-size:16px}.capacity{padding:6px 11px;border-radius:12px;background:#5d3c23;color:#fff4cf;font-weight:1000}
.upgrade-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px;padding:9px 10px;border:2px solid #8a6137;border-radius:13px;background:#fff2c5}.upgrade-row div{display:grid;gap:2px}.upgrade-row small{font-size:11px;font-weight:800;color:#80603c}.upgrade-row button{border:2px solid #466c91;border-radius:11px;padding:8px 11px;background:linear-gradient(#dff7ff,#83d8ff);color:#173c57;font-weight:1000;cursor:pointer;box-shadow:0 2px 0 #3d7898}.upgrade-row button:disabled{filter:grayscale(1);opacity:.55}.gem{background:#dff7ff}.meter{height:11px;background:#765438;border:2px solid #52351f;border-radius:10px;overflow:hidden;margin:-4px 0 13px}.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#75cf45,#e4d947);transition:width .25s}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.tab{border:3px solid #76502a;border-radius:13px;padding:10px;background:#f8e8b8;color:#55371f;font-weight:1000;cursor:pointer}.tab.on{background:linear-gradient(#ffd968,#e9a735);transform:translateY(-1px);box-shadow:0 3px 0 #8c5726}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;min-height:280px}
.slot{position:relative;min-width:0;min-height:108px;border:3px solid #8a6137;border-radius:15px;background:linear-gradient(#fff9dd,#edd6a1);box-shadow:inset 0 0 0 2px #fff8,0 3px 7px #0002;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;text-align:center}
.slot .ico{font-size:48px;line-height:1}.slot img{width:66px;height:66px;object-fit:contain;filter:drop-shadow(0 3px 2px #0003)}.slot b{font-size:13px;margin-top:5px}.slot .sell{margin-top:6px;border:0;border-radius:9px;padding:5px 9px;background:linear-gradient(#ffd96a,#e5a32f);color:#4a2c12;font-size:11px;font-weight:1000;cursor:pointer}.crop-grid{display:flex;gap:9px;overflow-x:auto;min-height:0;padding:4px 2px 10px}.crop-grid .slot{flex:0 0 112px;min-height:125px;height:125px;padding:6px}.crop-grid .slot .ico{font-size:42px}.crop-grid .slot b{font-size:11px}.pet-grid .slot .qty{display:none}.qty{position:absolute;right:5px;bottom:5px;min-width:28px;padding:3px 7px;border-radius:12px;background:#583b24;color:#fff;font-size:12px;font-weight:1000}
.pet-grid{grid-template-columns:repeat(5,minmax(0,1fr));}.pet-grid .slot{min-width:0;height:105px;min-height:105px;padding:5px;overflow:hidden}.pet-grid .slot img{width:54px;height:54px;max-width:100%}.pet-grid .slot b{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.empty{grid-column:1/-1;align-self:center;text-align:center;color:#806848;font-weight:900;font-size:16px}.empty span{display:block;font-size:52px;margin-bottom:6px;opacity:.7}
.foot{text-align:center;margin-top:12px;font-size:12px;font-weight:800;color:#765a38}
@media(max-width:600px){.crop-grid{gap:7px}.crop-grid .slot{flex-basis:105px}.pet-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.pet-grid .slot{height:100px;min-height:100px;padding:4px}.pet-grid .slot img{width:50px;height:50px}.title{font-size:18px}.money{font-size:12px;padding:7px}.back{font-size:12px;padding:8px}.shell{margin-top:15px}.panel{padding:18px 10px 12px}.grid{grid-template-columns:repeat(3,1fr);gap:7px}.slot{min-height:105px;padding:5px}.slot .ico{font-size:40px}.slot img{width:56px;height:56px}.slot b{font-size:11px}}
</style>
</head>
<body>
<header class="top"><button class="back" id="back" aria-label="Đóng kho">✕</button><div class="title">KHO NÔNG TRẠI</div><div class="money">🪙 <span id="coins">0</span></div><div class="money gem">💎 <span id="gems">0</span></div></header>
<main class="shell"><div class="sign">📦 KHO</div><section class="panel">
<div class="info"><b>Vật phẩm của bạn</b><span class="capacity" id="capacity">0 / 100</span></div><div class="upgrade-row"><div><b id="warehouseLevel">Kho cấp 1</b><small id="upgradeInfo">+50 sức chứa mỗi cấp</small></div><button id="upgradeBtn">💎 Nâng cấp</button></div><div class="meter"><i id="meter"></i></div>
<div class="tabs"><button class="tab on" data-tab="crop">🌾 Nông sản</button><button class="tab" data-tab="pet">🐾 Vật nuôi</button></div>
<div class="grid" id="grid"></div><div class="foot">Mỗi loại Kho có sức chứa và thanh trạng thái riêng.</div>
</section></main>
<script>
(()=>{'use strict';const KEY='nongtrai_new_v1';
const DEF={coins:100,gems:0,inventory:{carrot:0,corn:0,tomato:0,wheat:0},pets:{animals:[],capacity:4,feed:0},warehouse:{capacity:100,level:1,petCapacity:5,petLevel:1}};
const merge=(a,b)=>{if(!b||typeof b!=='object')return a;Object.keys(b).forEach(k=>{if(a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k])&&b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k]))merge(a[k],b[k]);else a[k]=b[k]});return a};
let S=JSON.parse(JSON.stringify(DEF));try{const x=localStorage.getItem(KEY);if(x)merge(S,JSON.parse(x))}catch(e){}
const items={carrot:['🥕','Cà rốt',11],wheat:['🌾','Lúa mì',20],potato:['🥔','Khoai tây',28],tomato:['🍅','Cà chua',38],eggplant:['🍆','Cà tím',52],corn:['🌽','Bắp',66],berry:['🍓','Dâu tây',108],pumpkin:['🎃','Bí ngô',230],melon:['🍉','Dưa hấu',330],grape:['🍇','Nho',470],pine:['🍍','Dứa',700],sun:['🌻','Hướng dương',1100]};const petTypes={pig_baby:['Heo con',20],lamb:['Cừu con',50],pig:['Heo hồng',60],sheep:['Cừu sừng',75],pig_flower:['Heo hoa vàng',125],pig_blue:['Heo xanh',150],sheep_flower:['Cừu hoa đỏ',160],cow:['Bò sữa',200],pig_gold:['Heo vàng có cánh',6]};let tab='crop';
function allCount(){return Object.values(S.inventory||{}).reduce((a,n)=>a+(Number(n)||0),0)}
async function saveCloud(){try{const u=firebase.auth().currentUser;if(!u)return;localStorage.setItem(KEY,JSON.stringify(S));const ref=firebase.firestore().collection('users').doc(u.uid);const old=await ref.get();const data=old.exists?old.data():{};const petGame=data.petGame||{};petGame.animals=S.pets?.animals||[];petGame.cap=Number(petGame.cap)||10;petGame.inv=petGame.inv||{};petGame.coins=Number(S.coins)||0;petGame.gems=Number(S.gems)||0;await ref.set({game:S,petGame,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true})}catch(e){console.error('Lưu Kho:',e)}}
function currentLevel(){return tab==='pet'?(Number(S.warehouse?.petLevel)||1):(Number(S.warehouse?.level)||1)}
function upgradeCost(){return Math.max(5,currentLevel()*5)}
async function upgradeWarehouse(){const cost=upgradeCost();if((Number(S.gems)||0)<cost){alert('Không đủ Kim Cương. Cần 💎 '+cost);return}S.gems-=cost;if(tab==='pet'){S.warehouse.petLevel=(Number(S.warehouse.petLevel)||1)+1;S.warehouse.petCapacity=(Number(S.warehouse.petCapacity)||5)+3}else{S.warehouse.level=(Number(S.warehouse.level)||1)+1;S.warehouse.capacity=(Number(S.warehouse.capacity)||100)+20}render();await saveCloud()}
window.sellCrop=async function(k){const v=items[k];const n=Number(S.inventory?.[k]||0);if(!n)return;if(!confirm('Bán '+n+' '+v[1]+' với giá '+v[2]+' xu/cây?'))return;S.coins+=n*v[2];S.inventory[k]=0;render();await saveCloud()};window.sellPet=async function(id){const i=(S.pets?.animals||[]).findIndex(p=>p.id===id);if(i<0)return;const p=S.pets.animals[i],type=p.type||'',v=petTypes[type];if(!v)return;const cur=type==='pig_gold'?'💎':'🪙';if(!confirm('Bán '+(v[0])+' với giá '+v[1]+' '+cur+'?'))return;if(type==='pig_gold')S.gems+=v[1];else S.coins+=v[1];S.pets.animals.splice(i,1);render();await saveCloud()};function render(){document.getElementById('coins').textContent=Math.floor(Number(S.coins)||0);document.getElementById('gems').textContent=Math.floor(Number(S.gems)||0);const petMode=tab==='pet',total=petMode?(S.pets?.animals||[]).length:allCount(),cap=petMode?(Number(S.warehouse?.petCapacity)||5):(Number(S.warehouse?.capacity)||100);document.getElementById('capacity').textContent=total+' / '+cap;document.getElementById('meter').style.width=Math.min(100,total/cap*100)+'%';const lv=currentLevel(),cost=upgradeCost(),add=petMode?3:20;document.getElementById('warehouseLevel').textContent=(petMode?'Kho vật nuôi':'Kho nông sản')+' · Cấp '+lv;document.getElementById('upgradeInfo').textContent='+'+add+' sức chứa · Giá 💎 '+cost;document.getElementById('upgradeBtn').textContent='💎 '+cost+' · Nâng cấp';const g=document.getElementById('grid');g.innerHTML='';
g.classList.toggle('pet-grid',tab==='pet');g.classList.toggle('crop-grid',tab==='crop');if(tab==='crop'){Object.entries(items).forEach(([k,v])=>{const n=Number(S.inventory?.[k]||0);if(!n)return;g.innerHTML+='<div class="slot"><div class="ico">'+v[0]+'</div><b>'+v[1]+'</b><span class="qty">x'+n+'</span><button class="sell" onclick="sellCrop(\''+k+'\')">Bán '+v[2]+' 🪙</button></div>'})}
else{(S.pets?.animals||[]).forEach(p=>{const type=p.type||'';const names=petTypes;const name=names[type]?.[0]||'Vật nuôi';const price=names[type]?.[1]||0;const src='../nuoipet/img/'+type+'.webp';const cur=type==='pig_gold'?'💎':'🪙';g.innerHTML+='<div class="slot"><img src="'+src+'" onerror="this.style.display=\'none\';this.nextElementSibling.insertAdjacentHTML(\'afterbegin\',\'<span class=\\\'ico\\\'>🐾</span>\')"><b>'+name+'</b><button class="sell" onclick="sellPet(\''+p.id+'\')">Bán '+price+' '+cur+'</button></div>'})}
if(!g.children.length)g.innerHTML='<div class="empty"><span>📦</span>Chưa có vật phẩm</div>'}
document.getElementById('upgradeBtn').onclick=upgradeWarehouse;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x===b));render()});document.getElementById('back').onclick=()=>history.back();
if(typeof firebase!=='undefined'&&typeof FB_CONFIG!=='undefined'){try{if(!firebase.apps.length)firebase.initializeApp(FB_CONFIG);firebase.auth().onAuthStateChanged(async u=>{if(!u){location.replace('./login.html');return}try{const d=await firebase.firestore().collection('users').doc(u.uid).get();if(d.exists){const data=d.data();if(data.game)S=merge(JSON.parse(JSON.stringify(DEF)),data.game);if(data.petGame){S.pets=S.pets||{};S.pets.animals=Array.isArray(data.petGame.animals)?data.petGame.animals:[];S.pets.capacity=Number(S.warehouse?.petCapacity)||5}S.coins=Number(data.game?.coins??data.petGame?.coins??S.coins)||0;S.gems=Number(data.game?.gems??data.petGame?.gems??S.gems);localStorage.setItem(KEY,JSON.stringify(S))}}catch(e){}render()})}catch(e){render()}}else render();
})();
</script></body></html>
