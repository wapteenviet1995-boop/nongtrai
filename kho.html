<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kho · Nông Trại</title>
<script src="./config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#d9b36c;color:#3b2919}
body{min-height:100dvh;background:linear-gradient(#8fc95d,#d8b16b)}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px;background:#3d2a1de8;border-bottom:3px solid #6b4525;color:#fff}
.top button{border:2px solid #694724;border-radius:12px;background:#fff0bd;padding:9px 12px;font-weight:900;color:#3b2919}.top h1{margin:0;flex:1;text-align:center;font-size:22px}.coins{background:#fff0bd;color:#3b2919;border:2px solid #694724;border-radius:12px;padding:8px 12px;font-weight:1000}
.wrap{width:min(94vw,760px);margin:18px auto 90px;background:#fff5d5e8;border:4px solid #79512d;border-radius:22px;padding:14px;box-shadow:0 12px 30px #0004}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px}.capacity{font-weight:1000;background:#e8c77c;padding:7px 10px;border-radius:10px}
.tabs{display:flex;gap:7px;margin:12px 0}.tabs button{flex:1;border:2px solid #8c6330;border-radius:11px;padding:9px;background:#fffdf2;font-weight:900}.tabs button.on{background:#ffd45f}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.item{border:2px solid #b4935c;border-radius:14px;background:#fffdf2;padding:12px;text-align:center;min-height:110px}.item .ico{font-size:40px}.item b,.item small{display:block}.item small{margin-top:5px;font-weight:800}.empty{text-align:center;padding:35px 10px;font-weight:900;color:#7b684e;grid-column:1/-1}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}.top h1{font-size:18px}.wrap{margin-top:10px}}
</style></head><body>
<header class="top"><button id="back">🏝️ Đảo</button><h1>📦 KHO</h1><div class="coins">🪙 <span id="coins">0</span></div></header>
<main class="wrap"><div class="head"><b>Vật phẩm đang có</b><span class="capacity" id="capacity">0 / 100</span></div>
<div class="tabs"><button class="on" data-tab="crop">Nông sản</button><button data-tab="pet">Vật nuôi</button></div><div class="grid" id="grid"></div></main>
<script>
(()=>{'use strict';const KEY='nongtrai_new_v1';
const DEF={coins:100,inventory:{carrot:0,corn:0,tomato:0,wheat:0},pets:{animals:[],capacity:4,feed:0},warehouse:{capacity:100}};
const merge=(a,b)=>{if(!b||typeof b!=='object')return a;Object.keys(b).forEach(k=>{if(a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k])&&b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k]))merge(a[k],b[k]);else a[k]=b[k]});return a};
let S=JSON.parse(JSON.stringify(DEF));try{const x=localStorage.getItem(KEY);if(x)merge(S,JSON.parse(x))}catch(e){}
const items={carrot:['🥕','Cà rốt'],corn:['🌽','Ngô'],tomato:['🍅','Cà chua'],wheat:['🌾','Lúa mì']};
let tab='crop';
function render(){document.getElementById('coins').textContent=Math.floor(Number(S.coins)||0);const g=document.getElementById('grid');g.innerHTML='';let total=0;
 if(tab==='crop'){Object.entries(items).forEach(([k,v])=>{const n=Number(S.inventory?.[k]||0);total+=n;if(!n)return;g.innerHTML+='<div class="item"><div class="ico">'+v[0]+'</div><b>'+v[1]+'</b><small>Số lượng: '+n+'</small></div>'})}
 else{const pets=S.pets?.animals||[];total=pets.length;pets.forEach(p=>{const n=(p.type||'pet').replace('pet','');g.innerHTML+='<div class="item"><img src="./img/spr-'+n+'.webp" style="width:64px;height:64px;object-fit:contain"><b>Vật nuôi '+n+'</b><small>'+(Number(p.growth)||0)+'%</small></div>'})}
 if(!g.children.length)g.innerHTML='<div class="empty">Kho đang trống</div>';document.getElementById('capacity').textContent=total+' / '+(S.warehouse?.capacity||100)}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x===b));render()});
document.getElementById('back').onclick=()=>location.href='./game.html';
if(typeof firebase!=='undefined'&&typeof FB_CONFIG!=='undefined'){try{if(!firebase.apps.length)firebase.initializeApp(FB_CONFIG);firebase.auth().onAuthStateChanged(async u=>{if(!u){location.replace('./login.html');return}try{const d=await firebase.firestore().collection('users').doc(u.uid).get();if(d.exists&&d.data().game){S=merge(JSON.parse(JSON.stringify(DEF)),d.data().game);localStorage.setItem(KEY,JSON.stringify(S))}render()}catch(e){render()}})}catch(e){render()}}else render();
})();
</script></body></html>
