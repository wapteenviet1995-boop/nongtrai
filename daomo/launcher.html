<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mỏ</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui;background:#1d1712;color:#fff}.bg{height:100%;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#745536,#2a1c14 55%,#100c09);padding:20px}.card{width:min(92vw,430px);text-align:center;background:#2d2119e8;border:2px solid #9b7142;border-radius:22px;padding:26px;box-shadow:0 18px 60px #0009}.icon{font-size:70px}.card h1{margin:6px 0}.card p{color:#ddc6aa}.play{border:0;border-radius:14px;padding:13px 24px;font-size:18px;font-weight:900;background:#f3c65c;color:#3a2715;cursor:pointer}.ov{display:none;position:fixed;inset:0;background:#000b;z-index:50;padding:3vh 3vw}.ov.on{display:block}.pop{height:94vh;max-width:850px;margin:auto;background:#17120f;border:3px solid #a77a45;border-radius:20px;overflow:hidden;position:relative}.close{position:absolute;right:8px;top:8px;z-index:5;border:0;border-radius:50%;width:38px;height:38px;font-size:20px;font-weight:bold;background:#f3c65c;cursor:pointer}.pop iframe{width:100%;height:100%;border:0}</style></head>
<body><main class="bg"><section class="card"><div class="icon">⛏️💎</div><h1>Mỏ Kho Báu</h1><p>Đào sâu xuống lòng đất, tìm vàng, kim cương và kho báu quý hiếm.</p><button class="play" onclick="openMine()">Vào Mỏ</button><p><small>Nhấn nút để mở mini game dạng popup.</small></p></section></main>
<div class="ov" id="minePopup"><div class="pop"><button class="close" onclick="closeMine()">×</button><iframe id="mineFrame" title="Đào Mỏ"></iframe></div></div>
<script>function openMine(){document.getElementById('mineFrame').src='./index.html';document.getElementById('minePopup').classList.add('on')}function closeMine(){document.getElementById('minePopup').classList.remove('on');document.getElementById('mineFrame').src=''}document.getElementById('minePopup').addEventListener('click',e=>{if(e.target.id==='minePopup')closeMine()});</script></body></html>
